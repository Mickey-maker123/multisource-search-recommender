name: Product checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run engine tests in an actual Windows directory
        shell: pwsh
        run: |
          $tempDir = New-Item -ItemType Directory -Path (Join-Path $env:GITHUB_WORKSPACE ".test-tmp")
          $env:TEMP = $tempDir.FullName
          $env:TMP = $tempDir.FullName
          $env:JAVA_TOOL_OPTIONS = "-Djava.io.tmpdir=`"$($tempDir.FullName)`""
          mvn -B -f engine/pom.xml clean verify
      - run: python -m unittest discover -s model-service

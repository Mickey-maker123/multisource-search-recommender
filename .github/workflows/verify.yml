name: Product checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run engine tests in an actual Windows directory
        shell: pwsh
        run: |
          $tempDir = New-Item -ItemType Directory -Path (Join-Path $env:GITHUB_WORKSPACE ".test-tmp")
          $env:TEMP = $tempDir.FullName
          $env:TMP = $tempDir.FullName
          $env:JAVA_TOOL_OPTIONS = "-Djava.io.tmpdir=`"$($tempDir.FullName)`""
          # Populate PDFBox's per-user Windows font cache with the bundled synthetic PDF.
          # The ordinary import tests below retain the 30-second per-document limit.
          mvn -B -f engine/pom.xml -DskipTests package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = Join-Path $tempDir.FullName "pdf-probe.json"
          $timer = [Diagnostics.Stopwatch]::StartNew()
          java -Xmx256m -cp engine/target/engine.jar local.federated.engine.ParserWorker fixtures/d1/files/sample.pdf application/pdf $probe
          if ($LASTEXITCODE -ne 0 -or (Get-Content -Raw $probe | ConvertFrom-Json).state -ne "ready") { throw "PDF initialization failed" }
          Write-Host "Initial PDF parse (seconds):" $timer.Elapsed.TotalSeconds
          mvn -B -f engine/pom.xml clean verify
      - run: python -m unittest discover -s model-service
